name: Requeue contact notification

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment holding the database URL
        required: true
        default: production
        type: choice
        options:
          - preview
          - production
      submission_id:
        description: Submission UUID shown in the database/operator tooling
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: contact-requeue-${{ inputs.environment }}-${{ inputs.submission_id }}
  cancel-in-progress: false

jobs:
  requeue:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DATABASE_URL: ${{ secrets.CONTACT_DATABASE_URL }}
      SUBMISSION_ID: ${{ inputs.submission_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Require the protected database URL
        shell: bash
        run: test -n "$DATABASE_URL"
      - run: pnpm install --frozen-lockfile
      - name: Requeue one terminal notification
        run: pnpm contact:requeue -- "$SUBMISSION_ID"
