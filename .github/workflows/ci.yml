name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Sundays 15:17 UTC (08:17 for the repo owner). Off the hour: GitHub delays or drops cron runs
    # queued at popular times.
    - cron: '17 15 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event belongs in the key: the weekly run shares main's ref, so a push would cancel it.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check, lint, and unit tests
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check-types

      - name: Lint
        run: pnpm check-lint

      - name: Check format
        run: pnpm check-format

      - name: Check styles
        run: pnpm check-styles

      - name: Run unit tests
        run: pnpm test

      - name: Test server lifecycle
        run: pnpm exec vitest run --config vitest.infrastructure.config.mts

      - name: Production build
        run: pnpm build

  quality-gate:
    name: Type check, lint, and unit tests
    needs: quality
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify quality matrix
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ]; then
            echo "Quality matrix finished with: $QUALITY_RESULT"
            exit 1
          fi

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
        env:
          POSTGRES_USER: feedback_test
          POSTGRES_PASSWORD: feedback_test
          POSTGRES_DB: feedback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedback_test -d feedback_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://feedback_test:feedback_test@127.0.0.1:5432/feedback_test
      TEST_DATABASE_URL: postgresql://feedback_test:feedback_test@127.0.0.1:5432/feedback_test
      E2E_PORT: '3100'
      NEXT_PUBLIC_LOCALHOST_API: http://localhost:3100
      SMTP_SERVER_HOST: 127.0.0.1
      SMTP_SERVER_PORT: '1025'
      SMTP_SERVER_SECURE: 'false'
      SMTP_FROM: portfolio@example.test
      SITE_MAIL_RECIEVER: owner@example.test
      MAILPIT_API_URL: http://127.0.0.1:8025
      CONTACT_RATE_LIMIT_SECRET: ci-only-feedback-rate-limit-secret
      CONTACT_TRUSTED_IP_HEADER: x-feedback-test-ip

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply clean database migrations
        run: pnpm db:migrate

      - name: Verify persistence and notification integration
        run: pnpm test:integration

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run E2E tests
        # The weekly run doubles every test and drops retries, so a flake shows up red instead of
        # being quietly rescued on a second attempt.
        env:
          E2E_FLAGS: ${{ github.event_name == 'schedule' && '--repeat-each=2 --retries=0' || '' }}
        run: pnpm test:e2e $E2E_FLAGS

      - name: Verify browser behavior during a database outage
        env:
          E2E_CONTACT_FAILURE: database
          DATABASE_URL: postgresql://feedback_test:feedback_test@127.0.0.1:1/feedback_test
        run: pnpm exec playwright test e2e/contact-failures.spec.ts

      - name: Verify browser behavior during an SMTP outage
        env:
          E2E_CONTACT_FAILURE: smtp
          SMTP_SERVER_PORT: '1'
        run: pnpm exec playwright test e2e/contact-failures.spec.ts

      - name: Preserve failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-traces
          path: test-results/
          retention-days: 7
