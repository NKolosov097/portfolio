name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Sundays 15:17 UTC (08:17 for the repo owner). Off the hour: GitHub delays or drops cron runs
    # queued at popular times.
    - cron: '17 15 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event belongs in the key: the weekly run shares main's ref, so a push would cancel it.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check, lint, and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check-types

      - name: Lint
        run: pnpm check-lint

      - name: Check format
        run: pnpm check-format

      - name: Check styles
        run: pnpm check-styles

      - name: Run unit tests
        run: pnpm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    env:
      # Not a live database: the E2E suite under test today never touches persistence,
      # only next build/start needing a syntactically valid connection string.
      DATABASE_URL: postgresql://user:password@localhost:5432/portfolio
      NEXT_PUBLIC_LOCALHOST_API: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run E2E tests
        # The weekly run doubles every test and drops retries, so a flake shows up red instead of
        # being quietly rescued on a second attempt.
        env:
          E2E_FLAGS: ${{ github.event_name == 'schedule' && '--repeat-each=2 --retries=0' || '' }}
        run: pnpm test:e2e $E2E_FLAGS
